[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luminary"
version = "2.1.0"
description = "Lights geometries, stateless patterns, and a bit-efficient wire codec for an LED installation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    # Exact track lengths for stage queue timing (luminary/stage/audio.py).
    "mutagen>=1.47",
]

[project.optional-dependencies]
# `pip install -e .[dev]` for the test suite and the quality gates.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "mypy>=1.10",
    "black>=24.0",
    "types-pyserial",
    "types-PyYAML",
]
# Flashing boards needs a toolchain; the rest of the CLI does not.
flash = ["platformio>=6.1"]

[project.scripts]
luminary = "luminary.cli:main"

# Installed editable, deliberately: geometry configs and patterns live beside
# the package rather than inside it, and the code resolves them from the source
# tree (luminary/cli.py, luminary/stage/web.py).
[tool.setuptools.packages.find]
include = ["luminary*"]

[tool.mypy]
# 3.12 matches CI and the reference deployment. Must be >= 3.12: current
# numpy ships PEP 695 `type` statements in its stubs, which mypy rejects
# outright for older targets (this broke CI on 2026-07-31).
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
explicit_package_bases = true

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]