<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminary — Vibe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23c9a7ff'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; background: #0a0a0d; color: #dcdce4;
      font-family: system-ui, sans-serif; display: flex; flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap;
      padding: .55rem .8rem; background: #16161c; border-bottom: 1px solid #26262e;
    }
    header h1 { font-size: 1rem; margin: 0 .6rem 0 0; font-weight: 600; }
    #status { font-size: .8rem; color: #7fbf7f; }
    #nowbox { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; min-width: 0; }
    #now { font-size: .85rem; color: #9a9aa8; }
    #now b { color: #ffd9a0; font-weight: 600; }
    #liner { font-size: .76rem; font-style: italic; color: #747482; max-width: 34rem;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #liner:empty { display: none; }
    #menu-toggle {
      background: #22222b; color: #dcdce4; border: 1px solid #34343e; border-radius: 6px;
      padding: .2rem .55rem; cursor: pointer; font-size: .85rem;
    }
    main { flex: 1; min-height: 0; display: flex; gap: .8rem; padding: .8rem; }
    #viewer { position: relative; flex: 1; min-width: 0; }
    #viewer canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                     display: block; border-radius: 8px; }
    #side { width: 22rem; max-width: 42%; min-width: 0; display: flex; flex-direction: column; gap: .6rem; min-height: 0; }
    #menu {
      overflow-y: auto; background: #121218; border: 1px solid #26262e; border-radius: 8px;
      padding: .3rem; min-height: 0; flex: 1;
    }
    #menu.hidden { display: none; }
    .section { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
               color: #6a6a76; padding: .35rem .5rem .1rem; }
    .item {
      display: flex; gap: .45rem; align-items: baseline; padding: .28rem .5rem;
      border-radius: 6px; font-size: .84rem; cursor: pointer;
    }
    .item:hover { background: #1c1c24; }
    .item.playing { background: #2a2338; color: #efe6ff; }
    .item .n { color: #c9a7ff; font-variant-numeric: tabular-nums; }
    .item .who { color: #8a8a98; font-size: .74rem; margin-left: auto; white-space: nowrap; }
    .item .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #thread {
      overflow-y: auto; background: #121218; border: 1px solid #26262e; border-radius: 8px;
      padding: .3rem; max-height: 38%; min-height: 6rem; flex: none;
    }
    .gen { padding: .35rem .5rem; border-radius: 6px; font-size: .83rem; cursor: pointer; }
    .gen:hover { background: #1c1c24; }
    .gen.playing { background: #2a2338; }
    .gen.cooking { color: #ffd9a0; }
    .gen.failed { color: #8a6a6a; }
    .gen .head { display: flex; gap: .45rem; align-items: baseline; }
    .gen .n { color: #c9a7ff; font-variant-numeric: tabular-nums; }
    .gen .name { color: #efe6ff; font-weight: 600; }
    .gen .who { color: #8a8a98; font-size: .74rem; margin-left: auto; }
    .gen .prompt { color: #b6b6c2; }
    .gen .note { color: #9fd0ff; font-style: italic; font-size: .78rem; }
    .gen .err { color: #c88; font-size: .74rem; white-space: pre-wrap; }
    .gen .ctx { color: #62626e; font-size: .72rem; }
    form {
      display: flex; flex-direction: column; gap: .4rem; min-width: 0;
      background: #121218; border: 1px solid #26262e; border-radius: 8px; padding: .55rem;
      flex: none;
    }
    form input[type=text], form select {
      background: #1a1a21; color: #dcdce4; border: 1px solid #34343e;
      border-radius: 6px; padding: .35rem .45rem; font-size: .9rem;
      min-width: 0; box-sizing: border-box;
    }
    #prompt { font-size: 1rem; width: 100%; }
    .row { display: flex; gap: .4rem; align-items: center; min-width: 0; }
    .row input[type=text] { flex: 1 1 0; width: 0; }
    .row select { flex: 0 1 auto; max-width: 9rem; }
    #scratch-label { font-size: .82rem; color: #b6b6c2; user-select: none; white-space: nowrap; }
    #send {
      background: #4a3a7a; color: #f0e8ff; border: 1px solid #7a5fc0; border-radius: 6px;
      padding: .35rem .8rem; font-size: .9rem; cursor: pointer;
    }
    #send:hover { background: #5a4a90; }
    footer {
      display: flex; gap: .5rem; align-items: center;
      padding: .45rem .8rem; background: #16161c; border-top: 1px solid #26262e;
    }
    #stage-key {
      background: #1a1a21; color: #dcdce4; border: 1px solid #34343e;
      border-radius: 6px; padding: .3rem .45rem; font-size: .8rem; width: 7rem;
    }
    footer .legend { margin-left: auto; font-size: .78rem; color: #8a8a98; }
    .empty { color: #6a6a76; font-size: .82rem; padding: .45rem .5rem; }
  </style>
</head>
<body>
  <header>
    <h1>Luminary · Vibe</h1>
    <span id="status">connecting…</span>
    <div id="nowbox">
      <span id="now">…</span>
      <span id="liner"></span>
    </div>
    <button id="menu-toggle" title="patterns">☰</button>
  </header>
  <main>
    <div id="viewer"><canvas id="stage-canvas"></canvas></div>
    <div id="side">
      <div id="menu"></div>
      <div id="thread"><div class="empty">…</div></div>
      <form id="vibe-form">
        <input id="prompt" type="text" placeholder="what should the sphere do?" autocomplete="off" autofocus>
        <div class="row">
          <input id="name" type="text" placeholder="name" autocomplete="off">
          <input id="author" type="text" placeholder="you" autocomplete="off">
          <select id="model" title="model"></select>
        </div>
        <div class="row">
          <label id="scratch-label"><input type="checkbox" id="scratch"> from scratch</label>
          <span style="flex:1"></span>
          <button type="submit" id="send">↵ vibe</button>
        </div>
      </form>
    </div>
  </main>
  <footer>
    <input id="stage-key" type="password" placeholder="stage key" autocomplete="off">
    <span class="legend" id="backend"></span>
  </footer>
  <script type="module">
    import { initVibePage } from "./static/vibe.js";
    initVibePage();
  </script>
</body>
</html>
