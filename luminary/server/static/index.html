<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminary</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%237fbf7f'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; background: #0a0a0d; color: #dcdce4;
      font-family: system-ui, sans-serif; display: flex; flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
      padding: .55rem .8rem; background: #16161c; border-bottom: 1px solid #26262e;
    }
    header h1 { font-size: 1rem; margin: 0 .6rem 0 0; font-weight: 600; }
    select, button {
      background: #22222b; color: #dcdce4; border: 1px solid #34343e;
      border-radius: 6px; padding: .35rem .6rem; font-size: .85rem;
    }
    button { cursor: pointer; }
    button:hover { background: #2d2d38; }
    button:disabled { color: #5a5a66; background: #1a1a21; border-color: #26262e;
                      cursor: not-allowed; }
    button:disabled:hover { background: #1a1a21; }
    #stats { margin-left: auto; font-variant-numeric: tabular-nums;
             font-size: .8rem; color: #9a9aa8; }
    #status { font-size: .8rem; color: #7fbf7f; }
    main { flex: 1; min-height: 0; padding: .8rem; }
    #stage { position: relative; width: 100%; height: 100%; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                    display: block; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Luminary</h1>
    <select id="lights" title="Lights geometry"></select>
    <select id="pattern" title="Pattern"></select>
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="resync" title="Force a keyframe">Resync</button>
    <button id="render" disabled
            title="Press Play first — toggles realistic cloth render / flat light cells">Flat cells</button>
    <label id="cloth-label" for="cloth" title="Simulate cloth diffusion (blur radius)"
           style="font-size:.8rem;color:#9a9aa8;">cloth off</label>
    <input id="cloth" type="range" min="0" max="24" step="1" value="0"
           title="Simulate cloth diffusion (blur radius)">
    <span id="status">idle</span>
    <span id="tricount" title="Click a triangle on the canvas to toggle its PVC subunit"
          style="font-size:.8rem;color:#9a9aa8;"></span>
    <span id="stats"></span>
  </header>
  <main><div id="stage"><canvas id="glow"></canvas><canvas id="canvas"></canvas></div></main>
  <script type="module" src="/static/client.js"></script>
</body>
</html>
