<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminary — live preview</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%237fbf7f'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; background: #0a0a0d; color: #dcdce4;
      font-family: system-ui, sans-serif; display: flex; flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
      padding: .55rem .8rem; background: #16161c; border-bottom: 1px solid #26262e;
    }
    header h1 { font-size: 1rem; margin: 0 .6rem 0 0; font-weight: 600; }
    button {
      background: #22222b; color: #dcdce4; border: 1px solid #34343e;
      border-radius: 6px; padding: .35rem .6rem; font-size: .85rem; cursor: pointer;
    }
    button:hover { background: #2d2d38; }
    #live {
      font-size: .72rem; letter-spacing: .04em; text-transform: uppercase;
      color: #0a0a0d; background: #7fbf7f; border-radius: 4px; padding: .15rem .4rem;
      font-weight: 600;
    }
    #stats { margin-left: auto; font-variant-numeric: tabular-nums;
             font-size: .8rem; color: #9a9aa8; }
    #status { font-size: .8rem; color: #7fbf7f; }
    #wire { font-size: .78rem; color: #9a9aa8; font-variant-numeric: tabular-nums; }
    main { flex: 1; min-height: 0; padding: .8rem; }
    #stage { position: relative; width: 100%; height: 100%; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                    display: block; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Luminary</h1>
    <span id="live" title="These are the bytes the boards were sent">on air</span>
    <button id="render"
            title="Toggle realistic cloth render / flat light cells">Flat cells</button>
    <span id="status">connecting</span>
    <span id="wire"></span>
    <span id="tricount" style="font-size:.8rem;color:#9a9aa8;"></span>
    <span id="stats"></span>
  </header>
  <main><div id="stage"><canvas id="glow"></canvas><canvas id="canvas"></canvas></div></main>
  <script>window.LUMINARY_PREVIEW = true;</script>
  <script type="module" src="/static/client.js"></script>
  <script type="module">
    // Wire-side health, polled from the stream the boards are on. Kept out of
    // client.js: that class renders frames and knows nothing about serial.
    async function poll() {
      try {
        const info = await fetch("/api/preview/info").then((r) => r.json());
        const s = info.stats;
        const down = s.controllers_down.length
          ? ` · down ${s.controllers_down.join(",")}` : "";
        document.getElementById("wire").textContent =
          `boards ${s.controllers_up.join(",") || "none"}${down} · ` +
          `ack ${s.ack_median_ms ?? "—"} ms · stalls ${s.window_stalls} · ` +
          `budget ${s.budget_bytes} B`;
      } catch (e) { /* server going away; the socket status covers it */ }
    }
    poll();
    setInterval(poll, 1000);
  </script>
</body>
</html>
