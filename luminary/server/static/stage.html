<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminary — Stage</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%237fbf9f'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; background: #0a0a0d; color: #dcdce4;
      font-family: system-ui, sans-serif; display: flex; flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap;
      padding: .55rem .8rem; background: #16161c; border-bottom: 1px solid #26262e;
    }
    header h1 { font-size: 1rem; margin: 0 .6rem 0 0; font-weight: 600; }
    #status { font-size: .8rem; color: #7fbf7f; }
    #now { margin-left: auto; font-size: .85rem; color: #9a9aa8;
           font-variant-numeric: tabular-nums; }
    #now b { color: #ffd9a0; font-weight: 600; }
    #now .hold { color: #9fd0ff; }
    main { flex: 1; min-height: 0; display: flex; gap: .8rem; padding: .8rem; }
    #viewer { position: relative; flex: 1; min-width: 0; }
    #viewer canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                     display: block; border-radius: 8px; }
    #panel {
      width: 22rem; max-width: 45%; display: flex; flex-direction: column;
      gap: .6rem; min-height: 0;
    }
    #queue {
      flex: 1; overflow-y: auto; background: #121218; border: 1px solid #26262e;
      border-radius: 8px; padding: .3rem; min-height: 0;
    }
    .entry {
      display: flex; gap: .45rem; align-items: center;
      padding: .35rem .5rem; border-radius: 6px; font-size: .85rem;
    }
    .entry.played { color: #6a6a76; }
    .entry.playing { background: #22303b; color: #dff0ff; }
    .entry.playing .pat { color: #ffd9a0; font-weight: 600; }
    .entry .pat { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
    .entry .meta { color: #8a8a98; font-size: .75rem; white-space: nowrap; }
    .entry.playing .meta { color: #9fd0ff; }
    .entry button {
      background: #22222b; color: #b6b6c2; border: 1px solid #34343e;
      border-radius: 5px; padding: 0 .4rem; font-size: .8rem; cursor: pointer;
      line-height: 1.4;
    }
    .entry button:hover { background: #2d2d38; }
    #queue .empty { color: #6a6a76; font-size: .82rem; padding: .6rem .5rem; }
    form {
      display: grid; grid-template-columns: 1fr 5.5rem; gap: .4rem;
      background: #121218; border: 1px solid #26262e; border-radius: 8px;
      padding: .55rem;
    }
    form select, form input {
      background: #1a1a21; color: #dcdce4; border: 1px solid #34343e;
      border-radius: 6px; padding: .3rem .45rem; font-size: .85rem; min-width: 0;
    }
    form button {
      grid-column: 1 / -1; background: #24322a; color: #dcdce4;
      border: 1px solid #3a5343; border-radius: 6px; padding: .4rem;
      font-size: .9rem; cursor: pointer;
    }
    form button:hover { background: #2d3f35; }
    footer {
      display: flex; gap: .5rem; align-items: center;
      padding: .55rem .8rem; background: #16161c; border-top: 1px solid #26262e;
    }
    footer button {
      background: #22222b; color: #dcdce4; border: 1px solid #34343e;
      border-radius: 6px; padding: .35rem .8rem; font-size: .9rem; cursor: pointer;
    }
    footer button:hover { background: #2d2d38; }
    footer .legend { margin-left: auto; font-size: .78rem; color: #8a8a98; }
  </style>
</head>
<body>
  <header>
    <h1>Luminary · Stage</h1>
    <span id="status">connecting…</span>
    <span id="now">…</span>
  </header>
  <main>
    <div id="viewer"><canvas id="stage-canvas"></canvas></div>
    <div id="panel">
      <div id="queue"><div class="empty">loading queue…</div></div>
      <form id="add-form">
        <select id="add-pattern" title="pattern"></select>
        <input id="add-duration" type="number" min="1" step="1"
               placeholder="auto s" title="seconds (blank: pattern's own length)">
        <select id="add-audio" title="audio file"></select>
        <button type="submit">＋ add to queue</button>
      </form>
    </div>
  </main>
  <footer>
    <button id="skip" title="end the current entry now">⏭ skip</button>
    <button id="clear" title="drop the whole queue (keeps playing)">✕ clear queue</button>
    <span class="legend" id="audio-note"></span>
  </footer>
  <script type="module">
    import { initStagePage } from "./static/stage.js";
    initStagePage();
  </script>
</body>
</html>
