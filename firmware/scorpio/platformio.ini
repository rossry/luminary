; Luminary Scorpio firmware (spec §13.6)
;
;   pio run                 # build
;   pio run -t upload       # flash (BOOTSEL or picotool)
;   pio run -e controller1  # build with controller id 1
;
; Strip length is a build flag, not a runtime value: every show() clocks out
; LUMINARY_MAX_PER_STRIP pixels on all eight outputs whatever the loaded
; geometry uses, so it sets the frame-rate ceiling directly. Set it to the
; longest strip actually installed:
;
;   pio run -e controller0 --build-flag="-DLUMINARY_MAX_PER_STRIP=180"
;
; Measured on a Feather SCORPIO driving 6 channels of ACTIVE lights:
;   360 px -> ~40 ms/frame (~23 fps ceiling)
;   180 px -> see firmware/scorpio/README.md

[env]
; PlatformIO's *official* `raspberrypi` platform ships only `pico` and
; `nanorp2040connect` on the Arduino-mbed core: it has no SCORPIO board, and
; its core cannot drive NeoPXL8 (which needs the RP2040 PIO blocks exposed by
; the Earle Philhower arduino-pico core). The community platform below is the
; one arduino-pico itself documents; the board manifest selects
; `core = earlephilhower` on our behalf.
; Pinned to the exact commit every measurement in the README was taken
; against; bump deliberately, not as a side effect of a fresh checkout.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = adafruit_feather_scorpio
framework = arduino
lib_deps =
    adafruit/Adafruit NeoPXL8
    adafruit/Adafruit NeoPixel
build_flags = -O2

; 200 MHz against the stock 133: the per-frame cost above the DMA floor is
; pure CPU (decode + OKLCH->RGB + NeoPXL8 staging), so it scales with the
; clock. 200 MHz is the well-trodden RP2040 overclock -- no voltage change
; needed, and USB runs from its own 48 MHz domain, unaffected. The PIO strip
; timing is derived from the actual clock at runtime, so WS2812 timing holds.
board_build.f_cpu = 200000000L

[env:controller0]
build_flags = ${env.build_flags} -DLUMINARY_CONTROLLER_ID=0

[env:controller1]
build_flags = ${env.build_flags} -DLUMINARY_CONTROLLER_ID=1
